name: Offline provisioning regressions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/provisioning-offline.yml
      - Packaging/ProvisioningTests/**
      - Packaging/DataLifecycleTests/**
      - Packaging/scripts/**
      - LocalTalk/Provisioning.cs
      - IncomingTranslator/AppBrand.cs
      - FoxTransSource/FoxTrans/Providers/TranslationModelPrompts.cs

permissions:
  contents: read

concurrency:
  group: provisioning-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provisioning:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Run fake downloads and supervised helper regressions
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ('saywhat-provisioning-' + [Guid]::NewGuid().ToString('N'))
          $fixtureData = Join-Path $fixtureRoot 'ProvisioningTests'
          New-Item -ItemType Directory -Path $fixtureData -Force | Out-Null
          # The default test mode reads source contracts from its data path's
          # parent/scripts. Copy source text only; no script is executed.
          Copy-Item -LiteralPath 'Packaging/scripts' -Destination (Join-Path $fixtureRoot 'scripts') -Recurse
          $env:SAYWHAT_DATA_ROOT = $fixtureData
          dotnet run --project Packaging/ProvisioningTests/ProvisioningTests.csproj -c Release -- $fixtureData
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated installer data lifecycle regressions
        run: |
          # Creates only tiny synthetic files under Packaging/offline-lifecycle-fixtures.
          # No live app data, model loading, capture, installer execution or process stopping.
          dotnet run --project Packaging/DataLifecycleTests/DataLifecycleTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
