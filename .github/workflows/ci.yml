name: Build and offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 source build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Set up Node.js for static website checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check publication audit fixtures
        run: node eng/Check-PublicSource.mjs --self-test
      - name: Audit the indexed public source
        run: node eng/Check-PublicSource.mjs
      - name: Preserve reviewed license bytes
        run: ./Packaging/Test-ReleaseLicenses.ps1
      - name: Build native library, app and host; run offline checks
        run: ./eng/Build.ps1 -Configuration Release -RunTests

      # This workflow deliberately has no deployment, release upload, model
      # inference, microphone permission, administrator step, or stored secret.

  linux-helper-ownership:
    name: Linux loopback helper ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check selected ports and token-owned helper cleanup
        run: python3 Packaging/ProvisioningTests/test-managed-ports.py -v
      - name: Check Voxtral cleanup boundaries
        run: bash Packaging/ProvisioningTests/test-stop-voxtral.sh
      - name: Check CUDA compatibility without a GPU
        run: bash Packaging/ProvisioningTests/test-cuda-preflight.sh
      - name: Check headless package setup and interrupted transaction recovery
        run: bash Packaging/ProvisioningTests/test-bootstrap-packages.sh
      - name: Check Groups port arguments without inference dependencies
        run: python3 -m unittest discover -s Packaging/vibevoice -p test_ports.py -v
